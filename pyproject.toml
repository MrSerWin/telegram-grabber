[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-grabber"
version = "0.1.0"
description = "Scrape public Telegram channels' posts and media (no auth)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Servin Osmanov" }]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
]

[project.scripts]
tg-grabber = "tg_grabber.__main__:main"

[tool.setuptools]
packages = ["tg_grabber"]
